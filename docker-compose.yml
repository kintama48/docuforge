services:
  engine:
    build:
      context: ./engine
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"

  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      ENGINE_URL: http://engine:3001
      DATABASE_URL: file:/data/docuforge.db
      APP_URL: http://localhost:5173
      API_URL: http://localhost:3000
    volumes:
      - api-data:/data
    depends_on:
      - engine

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - api

  mcp-server:
    build: ./mcp-server
    ports:
      - "3200:3200"
    env_file:
      - ./mcp-server/.env
    environment:
      DOCUFORGE_API_BASE_URL: http://api:3000
    depends_on:
      - api

volumes:
  api-data:
