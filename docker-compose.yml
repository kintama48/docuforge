services:
  engine:
    build:
      context: ./engine
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      ENGINE_URL: http://engine:3001
      DATABASE_URL: file:/data/docuforge.db
      APP_URL: http://localhost:5173
      API_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      RENDER_QUEUE_ENABLED: "true"
      RENDER_QUEUE_AUTO_START_WORKER: "true"
    volumes:
      - api-data:/data
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_APP_NAME: DocuForge
        NEXT_PUBLIC_APP_URL: http://localhost:5173
        NEXT_PUBLIC_MARKETING_URL: http://localhost:5173
        NEXT_PUBLIC_CONSOLE_URL: http://localhost:5173
        NEXT_PUBLIC_BILLING_ENABLED: "false"
        NEXT_PUBLIC_BILLING_PROVIDER: none
        NEXT_PUBLIC_BILLING_PORTAL_URL: ""
        NEXT_PUBLIC_SENTRY_DSN: ""
    ports:
      - "5173:5173"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: DocuForge
      NEXT_PUBLIC_APP_URL: http://localhost:5173
      NEXT_PUBLIC_MARKETING_URL: http://localhost:5173
      NEXT_PUBLIC_CONSOLE_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp-server:
    build: ./mcp-server
    ports:
      - "3200:3200"
    env_file:
      - ./mcp-server/.env
    environment:
      DOCUFORGE_API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
  redis-data:
