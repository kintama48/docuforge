version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENGINE_URL=http://engine:3001
      - REDIS_URL=redis://redis:6379
      - RENDER_QUEUE_ENABLED=${RENDER_QUEUE_ENABLED:-true}
      - RENDER_QUEUE_AUTO_START_WORKER=${RENDER_QUEUE_AUTO_START_WORKER:-true}
      - RENDER_QUEUE_NAME=${RENDER_QUEUE_NAME:-docuforge-render}
      - RENDER_QUEUE_CONCURRENCY=${RENDER_QUEUE_CONCURRENCY:-2}
      - RENDER_QUEUE_ATTEMPTS=${RENDER_QUEUE_ATTEMPTS:-3}
      - RENDER_QUEUE_BACKOFF_MS=${RENDER_QUEUE_BACKOFF_MS:-2000}
      - RENDER_QUEUE_RESULT_TTL_SECONDS=${RENDER_QUEUE_RESULT_TTL_SECONDS:-3600}
      - DATABASE_URL=file:/data/docuforge.db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-32chars}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET:-docuforge-assets}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - BILLING_ENABLED=${BILLING_ENABLED:-false}
      - BILLING_PROVIDER=${BILLING_PROVIDER:-none}
      - BILLING_SUCCESS_URL=${BILLING_SUCCESS_URL}
      - BILLING_CANCEL_URL=${BILLING_CANCEL_URL}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_PRICE_ID_STARTER=${PADDLE_PRICE_ID_STARTER}
      - PADDLE_PRICE_ID_PRO=${PADDLE_PRICE_ID_PRO}
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID}
      - LEMONSQUEEZY_VARIANT_ID_STARTER=${LEMONSQUEEZY_VARIANT_ID_STARTER}
      - LEMONSQUEEZY_VARIANT_ID_PRO=${LEMONSQUEEZY_VARIANT_ID_PRO}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - db-data:/data
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  engine:
    build:
      context: ../engine
      dockerfile: docker/Dockerfile
    expose:
      - "3001"
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
