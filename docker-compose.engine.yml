networks:
  engine-net:
    name: engine-net

services:
  engine:
    container_name: engine
    # CI builds + pushes to GHCR (deploy-staging.yml / deploy-prod.yml).
    # Local fallback: if the image isn't pulled, `compose up` builds from ./engine
    # and tags it as the same ref. Override IMAGE_TAG to pin a specific build.
    image: ghcr.io/kintama48/docuforge-engine:${IMAGE_TAG:-latest}
    build:
      context: ./engine
      dockerfile: docker/Dockerfile
    networks:
      - engine-net
    expose:
      - "3001"
    env_file:
      - ./engine/.env.prod
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      RUST_LOG: info
      LOG_FORMAT: json
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
