networks:
  engine-net:
    name: engine-net

services:
  engine:
    container_name: engine
    build:
      context: ./engine
      dockerfile: docker/Dockerfile
    networks:
      - engine-net
    expose:
      - "3001"
    env_file:
      - ./engine/.env.prod
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      RUST_LOG: info
      LOG_FORMAT: json
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
