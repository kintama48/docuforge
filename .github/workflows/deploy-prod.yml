name: deploy-prod

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "CODEOWNERS"

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # don't cancel an in-flight prod deploy

jobs:
  test:
    uses: ./.github/workflows/ci-reusable.yml

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  build-and-deploy:
    needs: [test, trufflehog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'docker-compose.prod.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.prod.yml'
            engine:
              - 'engine/**'
              - 'docker-compose.engine.yml'
            mcp:
              - 'mcp-server/**'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-api:latest
            ghcr.io/${{ github.repository_owner }}/docuforge-api:prod-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-frontend:latest
            ghcr.io/${{ github.repository_owner }}/docuforge-frontend:prod-${{ steps.sha.outputs.short }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.docuforge.app
            NEXT_PUBLIC_APP_NAME=DocuForge
            NEXT_PUBLIC_APP_URL=https://www.docuforge.app
            NEXT_PUBLIC_MARKETING_URL=https://www.docuforge.app
            NEXT_PUBLIC_CONSOLE_URL=https://www.docuforge.app
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

      - name: Build and push engine
        if: steps.changes.outputs.engine == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          file: ./engine/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-engine:latest
            ghcr.io/${{ github.repository_owner }}/docuforge-engine:prod-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

      - name: Build and push mcp-server
        if: steps.changes.outputs.mcp == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: ./mcp-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-mcp-server:latest
            ghcr.io/${{ github.repository_owner }}/docuforge-mcp-server:prod-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=mcp-prod
          cache-to: type=gha,mode=max,scope=mcp-prod

      - name: Deploy to prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            cd ${{ secrets.SSH_DEPLOY_PATH_PROD }}
            bash deploy/deploy.sh prod ${{ steps.sha.outputs.short }}
