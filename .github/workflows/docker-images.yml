name: docker-images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-images.yml"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "frontend/**"
      - "api/**"
      - "engine/**"
      - "mcp-server/**"
      - "nginx/**"
  pull_request:
    paths:
      - ".github/workflows/docker-images.yml"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "frontend/**"
      - "api/**"
      - "engine/**"
      - "mcp-server/**"
      - "nginx/**"

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - name: engine
            context: ./engine
            dockerfile: ./engine/docker/Dockerfile
          - name: mcp-server
            context: ./mcp-server
            dockerfile: ./mcp-server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docuforge-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.docuforge.app
            NEXT_PUBLIC_APP_NAME=DocuForge
            NEXT_PUBLIC_APP_URL=https://www.docuforge.app
            NEXT_PUBLIC_MARKETING_URL=https://www.docuforge.app
            NEXT_PUBLIC_CONSOLE_URL=https://www.docuforge.app
