name: core-assertions

on:
  push:
    paths:
      - "api/**"
      - "frontend/**"
      - "mcp-server/**"
      - "engine/**"
      - "load-test/**"
      - "scripts/assertions-check.mjs"
      - "Makefile"
      - ".github/workflows/core-assertions.yml"
  pull_request:
    paths:
      - "api/**"
      - "frontend/**"
      - "mcp-server/**"
      - "engine/**"
      - "load-test/**"
      - "scripts/assertions-check.mjs"
      - "Makefile"
      - ".github/workflows/core-assertions.yml"

jobs:
  assertions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Assertions policy check
        run: make assertions-check

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies
        run: bun install
      - name: Run API tests
        run: bun test

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies
        run: bun install
      - name: Frontend lint
        run: bun run lint
      - name: Frontend tests
        run: bun run test:run

  mcp-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: MCP tests
        run: bun test

  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Engine clippy assertions
        run: cargo clippy --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: Engine tests
        run: cargo test
