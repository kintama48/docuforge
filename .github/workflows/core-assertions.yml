name: core-assertions

# Fire only on protected branches + PRs. Feature-branch pushes don't need
# to burn minutes here — PR creation will catch them.
on:
  push:
    branches: [dev, main]
    paths:
      - "api/**"
      - "frontend/**"
      - "mcp-server/**"
      - "engine/**"
      - "load-test/**"
      - "scripts/assertions-check.mjs"
      - "Makefile"
      - ".github/workflows/core-assertions.yml"
  pull_request:
    paths:
      - "api/**"
      - "frontend/**"
      - "mcp-server/**"
      - "engine/**"
      - "load-test/**"
      - "scripts/assertions-check.mjs"
      - "Makefile"
      - ".github/workflows/core-assertions.yml"

concurrency:
  group: core-assertions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path-filter job — gates the heavier jobs so they don't fire when their
  # service didn't change. Cuts ~80% of cold-cache minutes on small PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'scripts/assertions-check.mjs'
              - 'Makefile'
            frontend:
              - 'frontend/**'
            mcp:
              - 'mcp-server/**'
            engine:
              - 'engine/**'

  assertions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Assertions policy check
        run: make assertions-check

  api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Run API tests
        run: bun test

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Frontend lint
        run: bun run lint
      - name: Frontend tests
        run: bun run test:run

  mcp-tests:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: MCP tests
        run: bun test

  engine-tests:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Cache Rust target dir + ~/.cargo. Cold ~10min → warm ~1-2min for engine.
      # This is the single biggest GHA-minutes saver in the repo.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
          shared-key: "engine-tests"
      - name: Engine clippy assertions
        run: cargo clippy --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: Engine tests
        run: cargo test
