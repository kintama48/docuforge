name: deploy-staging

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "CODEOWNERS"

# Cancel in-progress runs when a new push lands — saves GHA minutes on free tier.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci-reusable.yml

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  build-and-deploy:
    needs: [test, trufflehog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'docker-compose.stag.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.stag.yml'
            engine:
              - 'engine/**'
              - 'docker-compose.engine.yml'
            mcp:
              - 'mcp-server/**'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-api:staging
            ghcr.io/${{ github.repository_owner }}/docuforge-api:staging-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,mode=max,scope=api-staging

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-frontend:staging
            ghcr.io/${{ github.repository_owner }}/docuforge-frontend:staging-${{ steps.sha.outputs.short }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.stag.docuforge.app
            NEXT_PUBLIC_APP_NAME=DocuForge
            NEXT_PUBLIC_APP_URL=https://stag.docuforge.app
            NEXT_PUBLIC_MARKETING_URL=https://stag.docuforge.app
            NEXT_PUBLIC_CONSOLE_URL=https://stag.docuforge.app
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

      # Engine is shared across stag + prod per KAN-52 — only build/push when engine/** changes.
      # The :staging tag is just a convenience alias; the prod image and stag image are the same content.
      - name: Build and push engine
        if: steps.changes.outputs.engine == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          file: ./engine/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-engine:staging
            ghcr.io/${{ github.repository_owner }}/docuforge-engine:staging-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

      - name: Build and push mcp-server
        if: steps.changes.outputs.mcp == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: ./mcp-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docuforge-mcp-server:staging
            ghcr.io/${{ github.repository_owner }}/docuforge-mcp-server:staging-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=mcp-staging
          cache-to: type=gha,mode=max,scope=mcp-staging

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USER_STAGING }}
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          script: |
            cd ${{ secrets.SSH_DEPLOY_PATH_STAGING }}
            bash deploy/deploy.sh stag ${{ steps.sha.outputs.short }}
