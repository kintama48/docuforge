[package]
name = "docuforge-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["timeout", "limit", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Typst (pinned)
typst = "0.12"
typst-pdf = "0.12"
comemo = "0.4"

# Supporting
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
url = "2"
time = { version = "0.3.36", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
thiserror = "1"
parking_lot = "0.12"
moka = { version = "0.12", features = ["sync"] }
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"
axum-test = "15"
tower = { version = "0.4", features = ["util"] }
pretty_assertions = "1"
tempfile = "3"
wiremock = "0.5"
