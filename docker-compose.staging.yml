# docker-compose.staging.yml — mirrors docker-compose.prod.yml with staging image tags.
# Pull images from GHCR (pushed by deploy-staging.yml CI workflow).
# Do NOT build here — CI builds and pushes; this file only pulls.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50

  frontend:
    image: ghcr.io/kintama48/docuforge-frontend:staging
    expose:
      - "5173"
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.00

  api:
    image: ghcr.io/kintama48/docuforge-api:staging
    expose:
      - "3000"
    env_file:
      - ./api/.env.stag
    environment:
      PORT: 3000
      NODE_ENV: production
      ENGINE_URL: http://engine:3001
      REDIS_URL: redis://redis:6379
    volumes:
      - api-data:/data
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.50

  engine:
    image: ghcr.io/kintama48/docuforge-engine:staging
    expose:
      - "3001"
    env_file:
      - ./engine/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      RUST_LOG: info
      LOG_FORMAT: json
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 2.00

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

volumes:
  api-data:
  redis-data:
