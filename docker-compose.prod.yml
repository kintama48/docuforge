networks:
  prod-net:
    name: prod-net
  engine-net:
    external: true
  stag-net:
    external: true

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - prod-net
      - stag-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50

  frontend:
    image: ghcr.io/kintama48/docuforge-frontend:${IMAGE_TAG:-latest}
    expose:
      - "5173"
    env_file:
      - ./frontend/.env.prod
    networks:
      - prod-net
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.00

  api:
    image: ghcr.io/kintama48/docuforge-api:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    networks:
      - prod-net
      - engine-net
    env_file:
      - ./api/.env.prod
    environment:
      PORT: 3000
      NODE_ENV: production
      ENGINE_URL: http://engine:3001
      REDIS_URL: redis://redis:6379
    volumes:
      - api-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.50

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    networks:
      - prod-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

volumes:
  api-data:
  redis-data:
